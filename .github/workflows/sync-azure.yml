
name: Sync GitHub to Azure Repos

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Azure DevOps
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_REPO_URL: https://dev.azure.com/FirstBornSolutions/Smart%20Parking%20Simulation/_git/smart-parking-sim
        run: |
          AUTH=$(printf ":%s" "$AZURE_PAT" | base64 -w 0)

          git -c http.extraheader="AUTHORIZATION: Basic $AUTH" \
            push "$AZURE_REPO_URL" HEAD:refs/heads/main
